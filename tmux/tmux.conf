unbind-key -a -T root
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g mouse on
set -s escape-time 0
set-option -g focus-events on
set -g history-limit 5000

set -g status-position bottom
set -g pane-border-lines double
set -g pane-border-style fg=white
set -g status-style bg=default,fg=white

set -g status-left ''
set -g status-left-length 20

set -g status-right-length 150
set -g status-right '#[fg=white,bold]#{?m:*vim*,#{pane_title} | ,}#[fg=white,bold]#{pane_current_path} | #[fg=white,bold]CPU: #{cpu_percentage} | #[fg=white,bold]RAM: #{ram_percentage}'
set -g window-status-separator ""

set -g window-status-format " #I:#W "
set -g window-status-style bg=default,fg=color240

set -g window-status-current-format " #I:#W "
set -g window-status-current-style bg=default,fg=white,bold

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 5

bind -n M-o split-window -v -c "#{pane_current_path}"
bind -n M-i split-window -h -c "#{pane_current_path}"
bind -n M-Enter new-window -c "#{pane_current_path}"

bind -n M-c kill-pane
bind -n M-w kill-window
bind -n M-d detach

bind -n M-Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'

